<style>
:root{
  color-scheme: light dark;
  --teal:#800020; --teal-deep:#5C0A1E; --brand:#800020; --byline:#0B6E4F;
  --gold:#E0B700; --gold-soft:#F4E6B0; --gold-on-teal:#FFE27A;
  --bg:#FAF7EE; --surface:#ffffff; --ink:#2A1418; --muted:#6B5A5D; --line:#E6DCD5;
  --on-teal:#FAF7EE; --on-teal-muted:#F1CBD3;
  --danger:#B42318; --danger-bg:#FDECEA; --on-danger:#ffffff;
  --serif:'Instrument Serif', Georgia, 'Times New Roman', serif;
  --sans:'DM Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --teal:#6E0A20; --teal-deep:#4A0716; --brand:#EBA3B2; --byline:#5FC9A6;
    --gold:#E0B700; --gold-soft:#3A3218; --gold-on-teal:#FFE27A;
    --bg:#140C0D; --surface:#1F1517; --ink:#F2E9EA; --muted:#B9A5A8; --line:#3A2A2D;
    --on-teal:#FAF1F2; --on-teal-muted:#E9BFC8;
    --danger:#FF9B8F; --danger-bg:#3B1714; --on-danger:#2A0D0A;
  }
}
:root[data-theme="dark"]{
  --teal:#6E0A20; --teal-deep:#4A0716; --brand:#EBA3B2; --byline:#5FC9A6;
  --gold:#E0B700; --gold-soft:#3A3218; --gold-on-teal:#FFE27A;
  --bg:#140C0D; --surface:#1F1517; --ink:#F2E9EA; --muted:#B9A5A8; --line:#3A2A2D;
  --on-teal:#FAF1F2; --on-teal-muted:#E9BFC8;
  --danger:#FF9B8F; --danger-bg:#3B1714; --on-danger:#2A0D0A;
}
html[lang="ar"]{ --sans:'IBM Plex Sans Arabic', 'DM Sans', system-ui, sans-serif; --serif:'IBM Plex Sans Arabic', Georgia, serif; }
*{ box-sizing:border-box; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:17px; line-height:1.5;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.wrap{ max-width:560px; margin:0 auto; padding:0 18px; }
header.top{
  padding-top:calc(env(safe-area-inset-top,0px) + 14px); padding-bottom:12px;
  display:flex; justify-content:space-between; align-items:center; gap:12px;
}
.brand{ font-family:var(--serif); font-size:1.45rem; color:var(--brand); line-height:1.1; }
.byline{ color:var(--byline); font-size:.88rem; font-weight:500; margin-top:3px; }
html[lang="ar"] .brand{ font-weight:700; font-size:1.3rem; }
.lang{
  border:1px solid var(--line); background:var(--surface); color:var(--ink);
  border-radius:999px; padding:7px 15px; font:inherit; font-size:.95rem; cursor:pointer;
}
.demo{ background:var(--gold-soft); color:var(--ink); border-radius:12px; padding:10px 14px; font-size:.9rem; margin:0 0 14px; }

.hero{ background:var(--teal); color:var(--on-teal); border-radius:26px; padding:30px 22px 24px; text-align:center; }
h1{ font-family:var(--serif); font-weight:400; font-size:clamp(2rem,8.5vw,2.7rem); line-height:1.08; margin:0 0 12px; }
html[lang="ar"] h1{ font-weight:700; font-size:clamp(1.55rem,6.5vw,2.05rem); line-height:1.45; }
.sub{ color:var(--on-teal-muted); margin:0 auto 24px; max-width:34ch; }
.mic{
  width:116px; height:116px; border-radius:50%; border:none; cursor:pointer;
  background:var(--gold); color:#1c1606; display:grid; place-items:center;
  margin:0 auto; position:relative; box-shadow:0 0 0 9px rgba(224,183,0,.22);
}
.mic svg{ width:46px; height:46px; }
.mic:disabled{ opacity:.45; cursor:not-allowed; }
.mic.listening::before{
  content:""; position:absolute; inset:-9px; border-radius:50%;
  border:3px solid var(--gold); animation:pulse 1.4s ease-out infinite;
}
@keyframes pulse{ from{ transform:scale(1); opacity:.9; } to{ transform:scale(1.4); opacity:0; } }
@media (prefers-reduced-motion: reduce){ .mic.listening::before{ animation:none; opacity:1; } }
.mic-status{ margin:16px 0 20px; font-weight:500; min-height:1.5em; }
.typebox{ text-align:start; }
.typebox label{ display:block; font-size:.9rem; color:var(--on-teal-muted); margin-bottom:6px; }
textarea{
  width:100%; min-height:88px; border-radius:14px; border:1px solid transparent;
  padding:12px 14px; font:inherit; background:var(--surface); color:var(--ink); resize:vertical;
}
.find{
  margin-top:10px; width:100%; padding:14px; border-radius:14px; cursor:pointer;
  background:var(--teal-deep); color:var(--on-teal); border:1px solid rgba(255,255,255,.22);
  font:inherit; font-weight:700;
}
.msg{ margin:10px 0 0; font-size:.92rem; color:var(--gold-on-teal); min-height:1.2em; text-align:start; }
.examples{ margin-top:18px; text-align:start; }
.examples p{ margin:0 0 8px; font-size:.9rem; color:var(--on-teal-muted); }
.ex{ display:flex; flex-wrap:wrap; gap:8px; }
.ex button{
  background:rgba(255,255,255,.12); color:var(--on-teal); border:1px solid rgba(255,255,255,.24);
  border-radius:999px; padding:7px 13px; font:inherit; font-size:.88rem; cursor:pointer; text-align:start;
}
:focus-visible{ outline:3px solid var(--gold); outline-offset:2px; }

#results{ margin:24px 0 48px; }
.said{ border-inline-start:3px solid var(--gold); padding:2px 14px; margin-bottom:20px; }
.said span{ display:block; font-size:.85rem; color:var(--muted); }
.said p{ margin:2px 0 0; font-size:1.05rem; }
.emergency{ background:var(--danger-bg); border:1.5px solid var(--danger); border-radius:18px; padding:18px; margin-bottom:20px; }
.emergency h2{ color:var(--danger); margin:0 0 6px; font-size:1.2rem; }
.emergency p{ margin:0 0 12px; }
.callbtn{
  display:inline-block; background:var(--danger); color:var(--on-danger); text-decoration:none;
  font-weight:700; border-radius:12px; padding:11px 18px; margin-inline-end:8px; margin-bottom:8px;
}
.ghost{
  background:transparent; border:1px solid var(--line); color:var(--ink);
  border-radius:12px; padding:10px 14px; font:inherit; cursor:pointer;
}
h2.section{ font-family:var(--serif); font-weight:400; font-size:1.7rem; line-height:1.15; margin:26px 0 10px; }
html[lang="ar"] h2.section{ font-weight:700; font-size:1.3rem; }
.note{ color:var(--muted); margin:0 0 10px; font-size:.95rem; }
.list{ border:1px solid var(--line); border-radius:16px; background:var(--surface); overflow:hidden; }
.row{ padding:14px 16px; border-top:1px solid var(--line); display:flex; justify-content:space-between; gap:12px; align-items:baseline; }
.row:first-child{ border-top:none; }
.row strong{ display:block; }
.row small{ color:var(--muted); font-size:.9rem; }
.row .where{ font-size:.85rem; color:var(--muted); white-space:nowrap; }
.q{ margin:16px 0; }
.q p{ margin:0 0 8px; font-weight:500; }
.chips{ display:flex; flex-wrap:wrap; gap:8px; }
.chips button{
  border:1px solid var(--line); background:var(--surface); color:var(--ink);
  border-radius:999px; padding:8px 15px; font:inherit; font-size:.95rem; cursor:pointer;
}
.chips button[aria-pressed="true"]{ background:var(--teal); color:var(--on-teal); border-color:var(--teal); }
.primary{
  width:100%; padding:15px; border-radius:14px; border:none; cursor:pointer; margin-top:8px;
  background:var(--teal); color:var(--on-teal); font:inherit; font-weight:700; font-size:1.05rem;
}
.card{ background:var(--surface); border:1px solid var(--line); border-radius:24px; overflow:hidden; margin-top:12px; }
.card-head{ background:var(--teal); color:var(--on-teal); padding:22px 20px 18px; }
.card-head .name{ font-family:var(--serif); font-size:2rem; line-height:1.1; }
html[lang="ar"] .card-head .name{ font-weight:700; font-size:1.5rem; line-height:1.4; }
.card-head .spec{ color:var(--on-teal-muted); margin-top:4px; }
.badge{ display:inline-block; background:var(--gold); color:#1c1606; border-radius:999px; padding:3px 11px; font-size:.8rem; font-weight:700; margin-top:12px; }
.facts{ margin:0; padding:4px 20px; }
.fact{ display:grid; grid-template-columns:7.2em 1fr; gap:10px; padding:12px 0; border-top:1px solid var(--line); }
.fact:first-child{ border-top:none; }
.fact dt{ color:var(--muted); font-size:.92rem; }
.fact dd{ margin:0; font-weight:500; }
.phone{ font-size:1.3rem; direction:ltr; unicode-bidi:isolate; }
.matched{ color:var(--muted); font-size:.9rem; padding:0 20px 4px; margin:0; }
.card-actions{ padding:14px 20px 20px; display:flex; gap:10px; flex-wrap:wrap; }
.card-actions .primary{ width:auto; flex:1 1 160px; margin:0; }
.card-actions .ghost{ flex:1 1 140px; }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
</style>
</head>

<div class="wrap">

    <button class="mic" id="mic" type="button" aria-pressed="false">

    <div class="typebox">
      <label for="q" data-i18n="orType">Or type it</label>
      <textarea id="q" data-i18n-ph="placeholder" placeholder="e.g. Pain in my right kidney, I had kidney stones before, I live in north Riyadh"></textarea>

      <p class="msg" id="msg" aria-live="polite"></p>
    </div>

    <div class="examples">
      <p data-i18n="tryOne">Try one:</p>
      <div class="ex" id="examples"></div>
    </div>
  </section>

  <section id="results" aria-live="polite"></section>
</div>

 "severe bleeding","bleeding heavily","vomiting blood","blood in vomit","stroke","face droop","slurred","suicid","kill myself","end my life","overdose",

/* ---------- Helpers ---------- */
function norm(s){
  return String(s).toLowerCase()
    .replace(/[\u064B-\u0652\u0640]/g,"")
    .replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي")
    .replace(/[’'`]/g,"").replace(/\s+/g," ").trim();
}
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function reEsc(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); }
function has(text, word){
  if(/[a-z]/.test(word)) return new RegExp("(^|[^a-z])"+reEsc(word)).test(text);
  return text.indexOf(word) !== -1;
}
DOCS.forEach(function(d,i){ d.i=i; d.kn=d.k.map(norm); });
var EM = EMERGENCY.map(norm);
var L = function(){ return lang==="ar" ? 1 : 0; };
function t(k, vars){
  var s = T[lang][k];
  if(vars){ Object.keys(vars).forEach(function(v){ s = s.replace("{"+v+"}", vars[v]); }); }
  return s;
}

/* ---------- State ---------- */
var lang = "en";
var state = { shown:false, text:"", emergency:false, ack:false, ranked:[], fallback:false,
  prefs:{ area:"any", gender:"any", time:"any" }, final:null };

/* ---------- Matching ---------- */
function isEmergency(n){
  if(EM.some(function(w){ return has(n,w); })) return true;
  var fever = has(n,"fever") || has(n,"حراره") || has(n,"حمي");
  var kidney = has(n,"kidney") || has(n,"flank") || has(n,"كلي") || has(n,"خاصره");
  return fever && kidney;
}
function rank(n){
  var r = DOCS.map(function(d){
    var hits = [];
    d.kn.forEach(function(w,j){ if(has(n,w)) hits.push(d.k[j]); });
    return { d:d, score:hits.length, hits:hits };
  }).filter(function(x){ return x.score > 0; })
    .sort(function(a,b){ return b.score - a.score || a.d.i - b.d.i; });
  state.fallback = r.length === 0;
  return r.length ? r : [{ d:DOCS[0], score:0, hits:[] }];
}
function inferPrefs(n){
  var p = { area:"any", gender:"any", time:"any" };
  var areas = { north:["north","شمال"], east:["east","شرق"], west:["west","غرب"], south:["south","جنوب"], central:["central","downtown","وسط"] };
  Object.keys(areas).forEach(function(a){ if(areas[a].some(function(w){ return has(n,w); })) p.area = a; });
  if(["female doctor","lady doctor","woman doctor","طبيبه","دكتوره"].some(function(w){ return has(n,w); })) p.gender = "f";
  else if(["male doctor","طبيب رجل"].some(function(w){ return has(n,w); })) p.gender = "m";
  if(["morning","صباح"].some(function(w){ return has(n,w); })) p.time = "morning";
  else if(["evening","night","after work","مساء","بالليل"].some(function(w){ return has(n,w); })) p.time = "evening";
  return p;
}
function pick(){
  var p = state.prefs;
  var pool = state.ranked.slice(0,6).map(function(x){
    var bonus = 0, misses = 0;
    if(p.area!=="any"){ if(x.d.a===p.area) bonus+=4; else misses++; }
    if(p.gender!=="any"){ if(x.d.g===p.gender) bonus+=3; else misses++; }
    if(p.time!=="any"){ if(x.d.tm===p.time) bonus+=2; else misses++; }
    return { x:x, s:x.score*10 + bonus, misses:misses };
  }).sort(function(a,b){ return b.s - a.s || a.x.d.i - b.x.d.i; });
  return { x:pool[0].x, misses:pool[0].misses };
}

/* ---------- Rendering ---------- */
function matchesLabel(n){
  if(n===1) return t("match1");
  if(n===2 && lang==="ar") return t("match2");
  return t("matchN",{n:n});
}
function chip(key, val, label){
  var on = state.prefs[key]===val;
  return '<button type="button" data-act="pref" data-key="'+key+'" data-val="'+val+'" aria-pressed="'+on+'">'+esc(label)+'</button>';
}
function renderResults(){
  var box = document.getElementById("results");
  if(!state.shown){ box.innerHTML = ""; return; }
  var h = '<div class="said"><span>'+esc(t("youSaid"))+'</span><p>“'+esc(state.text)+'”</p></div>';

  if(state.emergency){
    h += '<div class="emergency" role="alert"><h2>'+esc(t("emTitle"))+'</h2><p>'+esc(t("emText"))+'</p>'+
         '<a class="callbtn" href="tel:997">'+esc(t("emCall"))+'</a>'+
         '<p style="margin-top:6px">'+esc(t("emLine"))+'</p>'+
         (state.ack ? '' : '<button type="button" class="ghost" data-act="ack">'+esc(t("emContinue"))+'</button>')+'</div>';
    if(!state.ack){ box.innerHTML = h; return; }
  }

  var top = state.ranked.slice(0,3);
  h += '<h2 class="section">'+esc(state.fallback ? t("best") : matchesLabel(top.length))+'</h2>';
  if(state.fallback) h += '<p class="note">'+esc(t("noMatch"))+'</p>';
  h += '<div class="list">';
  top.forEach(function(x){
    h += '<div class="row"><div><strong>'+esc(x.d.n[L()])+'</strong><small>'+esc(x.d.s[L()])+'</small></div>'+
         '<span class="where">'+esc(t(x.d.a+"F"))+'</span></div>';
  });
  h += '</div>';

  h += '<h2 class="section">'+esc(t("questions"))+'</h2>';
  h += '<div class="q"><p>'+esc(t("qArea"))+'</p><div class="chips">'+
       ["north","east","west","south","central"].map(function(a){ return chip("area",a,t(a)); }).join("")+
       chip("area","any",t("any"))+'</div></div>';
  h += '<div class="q"><p>'+esc(t("qGender"))+'</p><div class="chips">'+
       chip("gender","m",t("male"))+chip("gender","f",t("female"))+chip("gender","any",t("noPref"))+'</div></div>';
  h += '<div class="q"><p>'+esc(t("qTime"))+'</p><div class="chips">'+
       chip("time","morning",t("morning"))+chip("time","evening",t("evening"))+chip("time","any",t("anyTime"))+'</div></div>';
  h += '<button type="button" class="primary" data-act="show">'+esc(t("showDoctor"))+'</button>';

  if(state.final){
    var d = state.final.x.d, i = L();
    h += '<h2 class="section" id="bestHead">'+esc(t("best"))+'</h2>';
    if(state.final.misses > 0) h += '<p class="note">'+esc(t("prefNote"))+'</p>';
    h += '<article class="card"><div class="card-head"><div class="name">'+esc(d.n[i])+'</div>'+
         '<div class="spec">'+esc(d.s[i])+'</div><span class="badge">'+esc(t("fictional"))+'</span></div>'+
         '<dl class="facts">'+
         fact(t("fExp"), d.x[i])+fact(t("fQual"), d.q[i])+fact(t("fClinic"), d.c[i])+
         fact(t("fArea"), t(d.a+"F"))+fact(t("fDays"), t(d.d))+
         fact(t("fHours"), t(d.tm==="morning"?"hMorning":"hEvening"))+
         '<div class="fact"><dt>'+esc(t("fPhone"))+'</dt><dd class="phone">'+esc(d.p)+'</dd></div>'+
         '</dl>';
    if(state.final.x.hits.length) h += '<p class="matched">'+esc(t("matchedOn",{w:state.final.x.hits.slice(0,4).join(t("sep"))}))+'</p>';
    h += '<div class="card-actions"><button type="button" class="primary" data-act="copy" data-phone="'+esc(d.p)+'">'+esc(t("copy"))+'</button>'+
         '<button type="button" class="ghost" data-act="again">'+esc(t("again"))+'</button></div></article>';
  }
  box.innerHTML = h;
}
function fact(label, val){ return '<div class="fact"><dt>'+esc(label)+'</dt><dd>'+esc(val)+'</dd></div>'; }

var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function goTo(el){ if(el) el.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block:"start" }); }

/* ---------- Search ---------- */
var qBox = document.getElementById("q");
var msg = document.getElementById("msg");
function setMsg(s){ msg.textContent = s || ""; }
function runSearch(){
  var text = qBox.value.trim();
  if(!text){ setMsg(t("emptyInput")); return; }
  setMsg("");
  var n = norm(text);
  state.text = text;
  state.emergency = isEmergency(n);
  state.ack = false;
  state.ranked = rank(n);
  state.prefs = inferPrefs(n);
  state.final = null;
  state.shown = true;
  renderResults();
  goTo(document.getElementById("results"));
}
document.getElementById("findBtn").addEventListener("click", runSearch);

document.getElementById("results").addEventListener("click", function(e){
  var b = e.target.closest("button"); if(!b) return;
  var act = b.getAttribute("data-act");
  if(act==="ack"){ state.ack = true; renderResults(); }
  else if(act==="pref"){ state.prefs[b.getAttribute("data-key")] = b.getAttribute("data-val"); state.final = null; renderResults(); }
  else if(act==="show"){ state.final = pick(); renderResults(); goTo(document.getElementById("bestHead")); }
  else if(act==="copy"){
    var ph = b.getAttribute("data-phone");
    var done = function(){ b.textContent = t("copied"); };
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(ph).then(done, function(){}); }
  }
  else if(act==="again"){
    state.shown = false; state.final = null; qBox.value = ""; renderResults();
    window.scrollTo({ top:0, behavior: reduceMotion ? "auto" : "smooth" });
    document.getElementById("mic").focus();
  }
});

/* ---------- Voice ---------- */
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var mic = document.getElementById("mic"), micStatus = document.getElementById("micStatus"), micLabel = document.getElementById("micLabel");
var rec = null, listening = false;
function setListening(on){
  listening = on;
  mic.classList.toggle("listening", on);
  mic.setAttribute("aria-pressed", on ? "true" : "false");
  micStatus.textContent = t(on ? "micListening" : "micIdle");
  micLabel.textContent = micStatus.textContent;
}
function startListening(){
  rec = new SR();
  rec.lang = lang==="ar" ? "ar-SA" : "en-US";
  rec.interimResults = true;
  rec.continuous = false;
  var finalText = "";
  rec.onresult = function(e){
    var interim = "";
    for(var i=e.resultIndex; i<e.results.length; i++){
      var r = e.results[i];
      if(r.isFinal) finalText += r[0].transcript + " "; else interim += r[0].transcript;
    }
    qBox.value = (finalText + interim).trim();
  };
  rec.onerror = function(e){
    if(e.error==="not-allowed" || e.error==="service-not-allowed") setMsg(t("micDenied"));
    else if(e.error==="no-speech") setMsg(t("noSpeech"));
  };
  var thisRec = rec, finished = false;
  thisRec.finish = function(){
    if(finished) return;
    finished = true;
    clearTimeout(thisRec.killTimer);
    if(rec === thisRec) rec = null;
    setListening(false);
    if(qBox.value.trim()) runSearch();
  };
  rec.onend = function(){ thisRec.finish(); };
  setMsg("");
  try { rec.start(); setListening(true); } catch(err){ rec = null; setListening(false); }
}
function stopListening(){
  if(!rec){ setListening(false); return; }
  var r = rec;
  setListening(false);
  try { r.stop(); } catch(err){}
  // Some phones never end the session on stop(), so force it after a short wait
  r.killTimer = setTimeout(function(){
    try { r.abort(); } catch(err){}
    r.finish();
  }, 800);
}
if(!SR){ mic.disabled = true; }
mic.addEventListener("click", function(){
  if(!SR){ setMsg(t("noVoice")); return; }
  if(listening) stopListening(); else { qBox.value = ""; startListening(); }
});

  qBox.value = b.textContent; runSearch();
});
function applyStatic(){
  document.documentElement.lang = lang;
  document.documentElement.dir = lang==="ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-i18n]").forEach(function(el){ el.textContent = t(el.getAttribute("data-i18n")); });
  document.querySelectorAll("[data-i18n-ph]").forEach(function(el){ el.placeholder = t(el.getAttribute("data-i18n-ph")); });
  document.getElementById("langBtn").textContent = t("langBtn");
  document.title = t("brand") + " | " + t("byline");
  micStatus.textContent = t(listening ? "micListening" : "micIdle");
  micLabel.textContent = micStatus.textContent;
  if(!SR) setMsg(t("noVoice"));
}
document.getElementById("langBtn").addEventListener("click", function(){
  if(listening) stopListening();
  lang = lang==="en" ? "ar" : "en";
  applyStatic(); renderExamples(); renderResults();
});

applyStatic();
renderExamples();
})();
</script>
</body>
</html>
