<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a5c33"/>
      <stop offset="0.5" stop-color="#0d7a42"/>
      <stop offset="1" stop-color="#063d22"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#042f1a"/>
      <stop offset="1" stop-color="#0a5c33"/>
    </linearGradient>
    <linearGradient id="pages" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5edd0"/>
      <stop offset="0.5" stop-color="#e8d9a8"/>
      <stop offset="1" stop-color="#d4bf85"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5d77a"/>
      <stop offset="0.5" stop-color="#d4a017"/>
      <stop offset="1" stop-color="#a87d0c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#1aa860" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#063d22" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- ambient glow -->
  <ellipse cx="400" cy="300" rx="360" ry="300" fill="url(#glow)"/>

  <!-- book group, slight rotation for 3D feel -->
  <g transform="translate(400 300) rotate(-7) translate(-400 -300)">

    <!-- drop shadow -->
    <rect x="232" y="118" width="340" height="436" rx="14" fill="#000" opacity="0.28" filter="url(#soft)"/>

    <!-- page block (right edge) -->
    <rect x="540" y="100" width="26" height="430" rx="4" fill="url(#pages)"/>
    <g stroke="#c9b277" stroke-width="0.6" opacity="0.6">
      <line x1="544" y1="108" x2="544" y2="522"/>
      <line x1="550" y1="108" x2="550" y2="522"/>
      <line x1="556" y1="108" x2="556" y2="522"/>
      <line x1="562" y1="108" x2="562" y2="522"/>
    </g>

    <!-- spine -->
    <rect x="218" y="96" width="36" height="438" rx="8" fill="url(#spine)"/>

    <!-- front cover -->
    <rect x="240" y="96" width="312" height="438" rx="12" fill="url(#cover)"/>

    <!-- outer gold frame -->
    <rect x="262" y="118" width="268" height="394" rx="6" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
    <rect x="272" y="128" width="248" height="374" rx="4" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.7"/>

    <!-- central 8-point star medallion -->
    <g transform="translate(396 315)">
      <!-- outer rosette -->
      <g fill="none" stroke="url(#gold)" stroke-width="2">
        <polygon points="0,-95 26,-26 95,0 26,26 0,95 -26,26 -95,0 -26,-26" opacity="0.9"/>
        <polygon points="0,-95 26,-26 95,0 26,26 0,95 -26,26 -95,0 -26,-26" transform="rotate(45)" opacity="0.55"/>
      </g>
      <circle r="64" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.8"/>
      <circle r="50" fill="#063d22" opacity="0.5"/>
      <circle r="50" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.7"/>
      <!-- inner interlaced star -->
      <g fill="url(#gold)" opacity="0.92">
        <polygon points="0,-42 11,-11 42,0 11,11 0,42 -11,11 -42,0 -11,-11"/>
      </g>
      <polygon points="0,-42 11,-11 42,0 11,11 0,42 -11,11 -42,0 -11,-11"
               transform="rotate(45)" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.8"/>
    </g>

    <!-- corner ornaments -->
    <g fill="url(#gold)" opacity="0.85">
      <path d="M280 136 q18 0 18 18 q-9 -4 -18 0 q4 -9 0 -18 z"/>
      <path d="M512 136 q-18 0 -18 18 q9 -4 18 0 q-4 -9 0 -18 z"/>
      <path d="M280 494 q18 0 18 -18 q-9 4 -18 0 q4 9 0 18 z"/>
      <path d="M512 494 q-18 0 -18 -18 q9 4 18 0 q-4 9 0 18 z"/>
    </g>

    <!-- spine bands -->
    <g stroke="url(#gold)" stroke-width="1.5" opacity="0.7">
      <line x1="224" y1="150" x2="248" y2="150"/>
      <line x1="224" y1="480" x2="248" y2="480"/>
    </g>
  </g>
</svg>
